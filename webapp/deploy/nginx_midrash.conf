# Included from the HAMATATE server block. Password-protected; users are in
# /home/adi/midrash/htpasswd (managed without sudo - see README).
location = /midrash { return 301 /midrash/; }
location /midrash/ {
    auth_basic "Midrash";
    auth_basic_user_file /home/adi/midrash/htpasswd;
    proxy_pass http://unix:/home/adi/midrash/gunicorn.sock;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
}
